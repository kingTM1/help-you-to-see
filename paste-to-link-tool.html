<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粘贴转可读文件</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115; --panel: #1a1d24; --panel2: #22262f;
    --border: #2e333d; --text: #e6e9ef; --muted: #8b93a3;
    --accent: #5b8cff; --accent2: #3a6bff; --green: #2ecc71;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #editor[contenteditable] {
    min-height: 260px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; font-size: 15px; outline: none; overflow-wrap: break-word;
  }
  #editor:empty:before { content: attr(data-ph); color: var(--muted); }
  #editor img { max-width: 100%; border-radius: 8px; margin: 8px 0; display: block; }
  .bar { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  button {
    border: none; border-radius: 9px; padding: 10px 18px;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: .15s; font-family: inherit;
  }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover { background: var(--accent); }
  .btn-ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  .result {
    margin-top: 18px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; display: none;
  }
  .result.show { display: block; }
  .result h3 { font-size: 15px; margin-bottom: 12px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .steps { font-size: 13px; color: var(--muted); margin-top: 14px; padding-left: 4px; }
  .steps li { margin: 6px 0; padding-left: 22px; position: relative; list-style: none; }
  .steps li:before {
    content: counter(s); counter-increment: s; position: absolute; left: 0; top: 1px;
    background: var(--accent2); color:#fff; width:18px; height:18px; border-radius:50%;
    font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:600;
  }
  .steps { counter-reset: s; }
  .steps code { background: var(--panel2); padding: 1px 6px; border-radius: 4px; color: var(--text); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .meta.warn { color: #ffb454; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #062b16; padding: 10px 20px;
    border-radius: 30px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>粘贴转可读文件</h1>
  <div class="sub">粘贴文字和图片，生成一个独立的 HTML 文件。上传到 GitHub Pages 后，得到的链接任何浏览器和大模型都能直接读取。</div>
  <div id="editor" contenteditable="true" data-ph="在这里粘贴文字和图片（Ctrl/⌘+V），或拖入图片…"></div>
  <div class="bar">
    <button class="btn-primary" id="gen">生成文件并下载</button>
    <button class="btn-ghost" id="clear">清空</button>
    <span class="hint">图片会自动压缩</span>
  </div>

  <div class="result" id="result">
    <h3>✓ 文件已生成并下载</h3>
    <div class="field">
      <label>文件名</label>
      <input id="fnameOut" readonly>
    </div>
    <div class="field">
      <label>上传后它的链接会是（把下面用户名/仓库名换成你自己的）</label>
      <input id="urlOut" readonly>
    </div>
    <div class="meta" id="meta"></div>
    <ol class="steps">
      <li>打开你的 GitHub 仓库页面</li>
      <li>点 <code>Add file</code> → <code>Upload files</code>，把刚下载的文件拖进去</li>
      <li>点 <code>Commit changes</code>，等约 1 分钟</li>
      <li>访问上面那个链接 —— 发给任何人或大模型都能直接读</li>
    </ol>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const editor = $('#editor');
const toast = $('#toast');

function showToast(m){ toast.textContent=m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); }

function compressImage(blob, maxW=1100, quality=0.72){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width:w, height:h } = img;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let out = c.toDataURL('image/webp', quality);
      if(!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', quality);
      resolve(out);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src=url;
  });
}

editor.addEventListener('paste', async (e)=>{
  const items=[...(e.clipboardData?.items||[])];
  const imgItem=items.find(i=>i.type.startsWith('image/'));
  if(imgItem){
    e.preventDefault();
    const data=await compressImage(imgItem.getAsFile());
    if(data) document.execCommand('insertHTML',false,`<img src="${data}">`);
  }
});
editor.addEventListener('dragover', e=>e.preventDefault());
editor.addEventListener('drop', async (e)=>{
  const files=[...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){
    e.preventDefault(); editor.focus();
    for(const f of files){ const d=await compressImage(f); if(d) document.execCommand('insertHTML',false,`<img src="${d}">`); }
  }
});

$('#clear').onclick=()=>{ editor.innerHTML=''; $('#result').classList.remove('show'); };

function sanitize(html){
  const tpl=document.createElement('template');
  tpl.innerHTML=html;
  tpl.content.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase();
      if(n.startsWith('on')) el.removeAttribute(a.name);
      if(n==='src'){ const v=a.value.trim(); if(!(v.startsWith('data:image/')||v.startsWith('https://')||v.startsWith('http://'))) el.removeAttribute('src'); }
    });
    if(['SCRIPT','IFRAME','OBJECT','EMBED','STYLE','LINK'].includes(el.tagName)) el.remove();
  });
  return tpl.innerHTML;
}

function buildFile(contentHtml, plainText){
  // a fully self-contained, JS-free page: server returns it, content is visible immediately
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const desc = esc(plainText.slice(0,150).replace(/\s+/g,' '));
  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="${desc}">
<title>${desc.slice(0,60) || '内容'}</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:0 auto;padding:32px 20px;line-height:1.7;color:#1a1a1a;background:#fff;font-size:17px}
img{max-width:100%;border-radius:8px;margin:12px 0;display:block}
</style>
</head>
<body>
<article>
${contentHtml}
</article>
</body>
</html>`;
}

$('#gen').onclick=()=>{
  const html=editor.innerHTML.trim();
  if(!html){ showToast('内容是空的'); return; }
  const plain=editor.innerText.trim();
  const clean=sanitize(html);
  const fileHtml=buildFile(clean, plain);

  // filename from first words + short random suffix
  const slugBase=plain.slice(0,20).replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,'') || 'note';
  const rand=Math.random().toString(36).slice(2,7);
  const fname=`${slugBase}-${rand}.html`;

  // download
  const blob=new Blob([fileHtml],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fname;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

  // show guide
  $('#result').classList.add('show');
  $('#fnameOut').value=fname;
  $('#urlOut').value=`https://你的用户名.github.io/仓库名/${fname}`;
  const kb=(fileHtml.length/1024).toFixed(0);
  const meta=$('#meta');
  meta.textContent=`文件大小约 ${kb} KB`;
  meta.className='meta'+(fileHtml.length>2000000?' warn':'');
  if(fileHtml.length>2000000) meta.textContent+=' — 偏大，图片较多，上传会慢一些。';
  showToast('文件已下载');
};
</script>
</body>
</html>
