<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粘贴转链接</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel2: #22262f;
    --border: #2e333d;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --accent2: #3a6bff;
    --green: #2ecc71;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* editor */
  #editor[contenteditable] {
    min-height: 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 15px;
    outline: none;
    overflow-wrap: break-word;
  }
  #editor:empty:before {
    content: attr(data-ph);
    color: var(--muted);
  }
  #editor img {
    max-width: 100%;
    border-radius: 8px;
    margin: 8px 0;
    display: block;
  }
  .bar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 9px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: .15s;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover { background: var(--accent); }
  .btn-ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }

  .result {
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .result.show { display: block; }
  .result label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 8px; }
  .link-row { display: flex; gap: 8px; }
  .link-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .meta.warn { color: #ffb454; }

  /* viewer */
  .viewer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 26px;
    font-size: 16px;
  }
  .viewer img { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block; }
  .viewer-actions { margin-bottom: 16px; display: flex; gap: 10px; }
  .plain {
    display: none;
    margin-top: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    color: var(--muted);
  }
  .plain.show { display: block; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #062b16; padding: 10px 20px;
    border-radius: 30px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const toast = $('#toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1600);
}

// ---------- image compression ----------
function compressImage(blob, maxW=1100, quality=0.72){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width:w, height:h } = img;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      // try webp first, fallback jpeg
      let out = c.toDataURL('image/webp', quality);
      if(!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', quality);
      resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

// ---------- EDITOR MODE ----------
function renderEditor(){
  app.innerHTML = `
    <h1>粘贴转链接</h1>
    <div class="sub">粘贴文字和图片，生成一个任何浏览器都能打开的链接。数据全部编码在链接里，不经过任何服务器。</div>
    <div id="editor" contenteditable="true" data-ph="在这里粘贴文字和图片（Ctrl/⌘+V），或拖入图片…"></div>
    <div class="bar">
      <button class="btn-primary" id="gen">生成链接并复制</button>
      <button class="btn-ghost" id="clear">清空</button>
      <span class="hint">图片会自动压缩，链接越短越好</span>
    </div>
    <div class="result" id="result">
      <label>链接已生成（已复制到剪贴板）</label>
      <div class="link-row">
        <input id="linkOut" readonly>
        <button class="btn-primary" id="copyBtn">复制</button>
      </div>
      <div class="meta" id="meta"></div>
      <div class="bar"><button class="btn-ghost" id="openBtn">在新标签打开预览</button></div>
    </div>
  `;

  const editor = $('#editor');

  // paste images -> compress and insert
  editor.addEventListener('paste', async (e)=>{
    const items = [...(e.clipboardData?.items||[])];
    const imgItem = items.find(i=>i.type.startsWith('image/'));
    if(imgItem){
      e.preventDefault();
      const blob = imgItem.getAsFile();
      const data = await compressImage(blob);
      if(data){
        document.execCommand('insertHTML', false, `<img src="${data}">`);
      }
    }
    // text pastes naturally
  });

  // drag & drop images
  editor.addEventListener('dragover', e=>{ e.preventDefault(); });
  editor.addEventListener('drop', async (e)=>{
    const files = [...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith('image/'));
    if(files.length){
      e.preventDefault();
      editor.focus();
      for(const f of files){
        const data = await compressImage(f);
        if(data) document.execCommand('insertHTML', false, `<img src="${data}">`);
      }
    }
  });

  $('#clear').onclick = ()=>{ editor.innerHTML=''; $('#result').classList.remove('show'); };

  $('#gen').onclick = ()=>{
    const html = editor.innerHTML.trim();
    if(!html){ showToast('内容是空的'); return; }
    const text = editor.innerText.trim();
    const payload = JSON.stringify({ h: html, t: text, v: 1 });
    const compressed = LZString.compressToEncodedURIComponent(payload);
    const base = location.href.split('#')[0];
    const link = base + '#d=' + compressed;

    const out = $('#linkOut');
    out.value = link;
    $('#result').classList.add('show');

    const kb = (link.length/1024).toFixed(1);
    const meta = $('#meta');
    meta.textContent = `链接长度 ${link.length.toLocaleString()} 字符（约 ${kb} KB）`;
    meta.className = 'meta' + (link.length > 30000 ? ' warn' : '');
    if(link.length > 30000){
      meta.textContent += ' — 偏长，部分聊天软件可能截断；建议减少或缩小图片。';
    }

    copyText(link);

    $('#copyBtn').onclick = ()=>copyText(link);
    $('#openBtn').onclick = ()=>{
      const w = window.open('', '_blank');
      w.document.write('<meta charset="utf-8"><title>预览</title>');
      w.document.write('<div style="font-family:sans-serif;max-width:760px;margin:24px auto;padding:0 16px;">'+html+'</div>');
      w.document.close();
    };
  };
}

function copyText(t){
  navigator.clipboard.writeText(t).then(
    ()=>showToast('已复制到剪贴板'),
    ()=>{ const o=$('#linkOut'); if(o){o.select();} showToast('请手动复制'); }
  );
}

// ---------- VIEWER MODE ----------
function sanitize(html){
  // allow only basic formatting + data/http(s) images; strip scripts & event handlers
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n = a.name.toLowerCase();
      if(n.startsWith('on')) el.removeAttribute(a.name);
      if(n==='src'){
        const v=a.value.trim();
        if(!(v.startsWith('data:image/')||v.startsWith('https://')||v.startsWith('http://'))) el.removeAttribute('src');
      }
      if(n==='href'){
        const v=a.value.trim();
        if(!(v.startsWith('https://')||v.startsWith('http://')||v.startsWith('mailto:'))) el.removeAttribute('href');
      }
    });
    if(['SCRIPT','IFRAME','OBJECT','EMBED','STYLE','LINK'].includes(el.tagName)) el.remove();
  });
  return tpl.innerHTML;
}

function renderViewer(raw){
  let data;
  try{
    const json = LZString.decompressFromEncodedURIComponent(raw);
    data = JSON.parse(json);
  }catch(e){ data = null; }

  if(!data || !data.h){
    app.innerHTML = `<h1>无法读取内容</h1><div class="sub">链接数据已损坏或不完整。</div>
      <div class="bar"><button class="btn-primary" id="new">创建新内容</button></div>`;
    $('#new').onclick = ()=>{ location.href = location.href.split('#')[0]; };
    return;
  }

  const clean = sanitize(data.h);
  app.innerHTML = `
    <div class="viewer-actions">
      <button class="btn-ghost" id="togglePlain">显示纯文本</button>
      <button class="btn-ghost" id="copyPlain">复制纯文本</button>
      <button class="btn-ghost" id="new">＋ 新建</button>
    </div>
    <div class="viewer">${clean}</div>
    <pre class="plain" id="plain"></pre>
  `;
  $('#plain').textContent = data.t || '';
  $('#togglePlain').onclick = ()=>{
    const p=$('#plain'); p.classList.toggle('show');
    $('#togglePlain').textContent = p.classList.contains('show')?'隐藏纯文本':'显示纯文本';
  };
  $('#copyPlain').onclick = ()=>copyText(data.t||'');
  $('#new').onclick = ()=>{ location.href = location.href.split('#')[0]; };

  // expose plain text for LLM scraping
  document.title = (data.t||'').slice(0,40) || '查看内容';
}

// ---------- ROUTER ----------
function route(){
  const hash = location.hash || '';
  const m = hash.match(/^#d=(.+)$/);
  if(m){ renderViewer(m[1]); }
  else { renderEditor(); }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
